version: '3.8'

services:
  # The Redis Message Queue
  redis:
    image: redis:7-alpine
    container_name: fastsend_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          memory: 256M
    restart: unless-stopped

  # The FastAPI Web Server
  api:
    build: .
    container_name: fastsend_api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 500M
    restart: unless-stopped

  # The Celery ML Worker (Heavy CPU)
  worker:
    build: .
    container_name: fastsend_worker
    command: celery -A app.celery_app.celery_app worker --loglevel=info -c 2
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 3G
    restart: unless-stopped

  # The Celery Beat Scheduler
  beat:
    build: .
    container_name: fastsend_beat
    command: celery -A app.celery_app.celery_app beat --loglevel=info
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 256M
    restart: unless-stopped

volumes:
  redis_data:
